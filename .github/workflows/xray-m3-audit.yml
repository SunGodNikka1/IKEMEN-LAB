name: X-Ray M3 audit
on:
  push:
    branches: ['codex/m3-adversarial-audit']
  pull_request:
    paths:
      - 'windows/IKEMENLab.Core/XRay/**'
      - 'windows/IKEMENLab.Tests/XRay*'
      - 'windows/scripts/xray_m3_adversarial.lua'
      - '.github/workflows/xray-m3-audit.yml'
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run unit tests
        run: dotnet test windows/IKEMENLab.Tests/IKEMENLab.Tests.csproj --configuration Release --logger 'console;verbosity=normal'
      - name: Build Windows app
        run: dotnet build windows/IKEMENLab.App/IKEMENLab.App.csproj --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua test host
        run: python -m pip install lupa
      - name: Run shipped Lua adversarial checks against API stubs
        run: python -c "from lupa import LuaRuntime; lua=LuaRuntime(); lua.execute('arg = {}'); lua.execute(open('windows/scripts/xray_m3_adversarial.lua', encoding='utf-8').read())"
